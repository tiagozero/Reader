<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader</title>
<style>
  :root{
    --bg:#ffffff;
    --sidebar-bg:#f7f8fa;
    --border:#e5e7eb;
    --text:#1f2937;
    --text-muted:#6b7280;
    --accent:#2563eb;
    --accent-soft:#eaf1fe;
    --highlight-bg: rgba(37,99,235,0.10);
    --highlight-border: rgba(37,99,235,0.55);
    --highlight-bg-hover: rgba(37,99,235,0.18);
    --radius:10px;
    --reader-font: Georgia, serif;
    --reader-size: 19px;
    --reader-width: 700px;
    --reader-line-height: 1.85;
    --reader-columns: 1;
    --reader-column-gap: 52px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px;
    min-width:280px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:margin-left .2s ease;
  }
  .sidebar.collapsed{ margin-left:-280px; }

  .sidebar-header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-header h1{
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0 0 12px;
    color:var(--text);
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:8px 10px 8px 30px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  .search-box input:focus{ border-color:var(--accent); }
  .search-box svg{
    position:absolute;
    left:9px; top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
  }

  .text-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
  }
  .text-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--text);
    line-height:1.35;
  }
  .text-item:hover{ background:#eef0f3; }
  .text-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .text-item .n{
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    font-size:12px;
    min-width:24px;
  }
  .text-item.active .n{ color:var(--accent); }
  .text-item .t{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .text-item.completed .n,
  .text-item.completed .t{ color:#16a34a; }
  .text-item.completed.active{ background:#eafaf0; }
  .text-item.completed.active .n,
  .text-item.completed.active .t{ color:#15803d; }
  .text-item .check{
    flex:none;
    color:#16a34a;
    display:none;
    margin-left:auto;
  }
  .text-item.completed .check{ display:inline-flex; }

  .category-group{ margin-bottom:2px; }
  .category-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border:none;
    background:transparent;
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
    font-weight:700;
    color:var(--text);
    text-align:left;
  }
  .category-header:hover{ background:#eef0f3; }
  .category-header .chev{
    flex:none;
    color:var(--text-muted);
    transition:transform .15s ease;
  }
  .category-header .chev.open{ transform:rotate(90deg); }
  .category-header .category-name{ flex:1; }
  .category-header .category-count{
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    background:var(--sidebar-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:1px 7px;
  }
  .category-header .category-progress{
    font-size:11px;
    font-weight:700;
    color:#16a34a;
    background:#eafaf0;
    border:1px solid #bbf0cf;
    border-radius:999px;
    padding:1px 7px;
    white-space:nowrap;
  }
  .category-items{ padding-left:6px; }

  .sidebar-footer{
    padding:12px 14px;
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--text-muted);
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:#fff;
    flex-wrap:wrap;
  }
  .toolbar .group{
    display:flex;
    align-items:center;
    gap:4px;
    padding:3px;
    background:var(--sidebar-bg);
    border-radius:9px;
    border:1px solid var(--border);
  }
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    border-radius:6px;
    cursor:pointer;
    color:var(--text);
    font-size:13px;
    font-weight:600;
  }
  .icon-btn:hover{ background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .icon-btn:active{ background:var(--accent-soft); }
  .icon-btn.col-btn{ width:auto; padding:0 9px; font-size:12.5px; }
  .icon-btn.col-btn.active{ background:#fff; color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .toolbar select{
    border:1px solid var(--border);
    background:#fff;
    border-radius:7px;
    padding:6px 8px;
    font-size:12.5px;
    color:var(--text);
    cursor:pointer;
    outline:none;
  }
  .toolbar .sep{ width:1px; height:22px; background:var(--border); margin:0 4px; }
  .spacer{ flex:1; }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{ background:var(--sidebar-bg); }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{ background:#1d4fd1; }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--text-muted); }
  .btn.ghost:hover{ background:var(--sidebar-bg); color:var(--text); }

  .menu-toggle{ display:flex; }

  .glossary-badge{
    font-size:11.5px;
    color:var(--text-muted);
    padding:0 6px;
  }

  /* ---------- Reader ---------- */
  .reader-scroll{
    flex:1;
    overflow-y:auto;
    padding:48px 24px 120px;
    display:flex;
    justify-content:center;
  }
  .reader-col{
    width:100%;
    max-width:calc(var(--reader-width) * var(--reader-columns) + var(--reader-column-gap) * (var(--reader-columns) - 1));
  }
  .reader-title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin:0 0 28px;
  }
  .reader-title{
    font-family:var(--reader-font);
    font-size:calc(var(--reader-size) + 10px);
    font-weight:700;
    line-height:1.25;
    margin:0;
    color:var(--text);
  }
  .complete-btn{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .complete-btn:hover{ background:#eef0f3; }
  .complete-btn.is-complete{
    background:#eafaf0;
    border-color:#bbf0cf;
    color:#15803d;
  }
  .complete-btn.is-complete:hover{ background:#defbe7; }
  .complete-btn svg{ flex:none; }
  .reader-body{
    font-family:var(--reader-font);
    font-size:var(--reader-size);
    line-height:var(--reader-line-height);
    color:var(--text);
    column-count:var(--reader-columns);
    column-gap:var(--reader-column-gap);
    column-rule:1px solid var(--border);
    column-fill:auto;
  }
  .reader-body p{ margin:0 0 1.3em; break-inside:avoid; }
  .reader-body.paged{
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    padding-bottom:6px;
  }

  .page-nav{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
  }
  .page-nav.show{ display:flex; }
  .page-nav-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    cursor:pointer;
  }
  .page-nav-btn:hover{ background:#eef0f3; }
  .page-nav-btn:disabled{ opacity:.4; cursor:default; }
  .page-nav-btn:disabled:hover{ background:#fff; }
  .page-nav-status{
    font-size:12px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }

  .gw{
    background:var(--highlight-bg);
    border-radius:3px;
    padding:0 1px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .gw:hover{ background:var(--highlight-bg-hover); }

  /* ---------- Vocabulary tracking (non-glossary words) ---------- */
  .word{
    cursor:pointer;
    border-radius:3px;
    padding:0 1px;
    transition:background .12s ease;
  }
  .word:hover{ background:rgba(37,99,235,.08); }

  .vw{
    cursor:pointer;
    border-radius:3px;
    padding:0 1px;
    transition:background .12s ease;
  }
  .vw.status-1{ background:rgba(234,179,8,.22); }   /* New */
  .vw.status-2{ background:rgba(249,115,22,.20); }  /* Learning */
  .vw.status-3{ background:rgba(16,185,129,.18); }  /* Familiar */
  .vw.status-4{ background:rgba(107,114,128,.14); } /* Known */
  .vw.status-1:hover{ background:rgba(234,179,8,.34); }
  .vw.status-2:hover{ background:rgba(249,115,22,.32); }
  .vw.status-3:hover{ background:rgba(16,185,129,.28); }
  .vw.status-4:hover{ background:rgba(107,114,128,.24); }

  .empty-state{
    max-width:420px;
    margin:80px auto;
    text-align:center;
    color:var(--text-muted);
  }
  .empty-state h2{ color:var(--text); font-size:18px; margin-bottom:8px; }
  .empty-state p{ font-size:13.5px; line-height:1.6; }

  /* ---------- Popup ---------- */
  .popup{
    position:fixed;
    z-index:50;
    background:#111827;
    color:#fff;
    padding:9px 13px;
    border-radius:8px;
    font-size:13.5px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    max-width:280px;
    line-height:1.4;
    pointer-events:none;
  }
  .popup .pw{
    font-weight:700;
    color:#93c5fd;
    display:block;
    margin-bottom:2px;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  /* ---------- Vocab popup (interactive) ---------- */
  .vocab-popup{
    position:fixed;
    z-index:55;
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.18);
    padding:12px;
    width:230px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .vocab-popup .vp-term{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:8px;
    word-break:break-word;
  }
  .vp-status-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:8px;
  }
  .vp-status-btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:6px;
    padding:6px 4px;
    font-size:11.5px;
    cursor:pointer;
    text-align:center;
    color:var(--text-muted);
  }
  .vp-status-btn[data-status="1"].active{ background:rgba(234,179,8,.22); border-color:rgba(234,179,8,.6); color:#7a5b00; }
  .vp-status-btn[data-status="2"].active{ background:rgba(249,115,22,.20); border-color:rgba(249,115,22,.6); color:#8a3a06; }
  .vp-status-btn[data-status="3"].active{ background:rgba(16,185,129,.18); border-color:rgba(16,185,129,.55); color:#066148; }
  .vp-status-btn[data-status="4"].active{ background:rgba(107,114,128,.16); border-color:rgba(107,114,128,.55); color:#374151; }
  .vocab-popup textarea{
    width:100%;
    min-height:44px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 8px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--text);
    margin-bottom:8px;
    outline:none;
  }
  .vocab-popup textarea:focus{ border-color:var(--accent); }
  .vp-actions{
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .vp-actions button{
    border:none;
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .vp-remove{ background:#fef2f2; color:#b91c1c; }
  .vp-remove:hover{ background:#fee2e2; }
  .vp-done{ background:var(--accent); color:#fff; margin-left:auto; }
  .vp-done:hover{ background:#1d4ed8; }

  /* ---------- Vocabulary modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:70;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:#fff;
    border-radius:12px;
    width:100%;
    max-width:560px;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .modal-header h2{ font-size:16px; margin:0; color:var(--text); }
  .modal-filters{
    display:flex;
    gap:6px;
    padding:12px 18px 0;
    flex-wrap:wrap;
  }
  .filter-chip{
    border:1px solid var(--border);
    background:#fff;
    color:var(--text-muted);
    border-radius:999px;
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;
  }
  .filter-chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .modal-body{
    padding:12px 18px 18px;
    overflow-y:auto;
    flex:1;
  }
  .vocab-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .vocab-row:last-child{ border-bottom:none; }
  .vr-main{ flex:1; min-width:0; }
  .vr-term{ font-weight:700; font-size:14px; color:var(--text); word-break:break-word; }
  .vr-note{ font-size:12.5px; color:var(--text-muted); margin-top:2px; word-break:break-word; }
  .vr-dot{
    width:9px; height:9px; border-radius:50%;
    flex:none; margin-top:5px;
  }
  .vr-dot.status-1{ background:#eab308; }
  .vr-dot.status-2{ background:#f97316; }
  .vr-dot.status-3{ background:#10b981; }
  .vr-dot.status-4{ background:#6b7280; }
  .vr-select{
    font-size:12px;
    border:1px solid var(--border);
    border-radius:6px;
    padding:4px 6px;
    background:#fff;
    color:var(--text);
  }
  .vr-del{
    border:none;
    background:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 4px;
  }
  .vr-del:hover{ color:#b91c1c; }
  .vocab-empty{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:30px 10px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:#111827;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .sidebar{ position:fixed; z-index:40; height:100%; box-shadow:0 0 0 2000px rgba(0,0,0,0); }
    .sidebar.collapsed{ margin-left:-280px; }
    .sidebar:not(.collapsed){ box-shadow:0 0 40px rgba(0,0,0,.15); }
    .menu-toggle{ display:flex; }
    .reader-scroll{ padding:32px 16px 100px; }
    .toolbar{ padding:8px 10px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <h1>My Library</h1>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search texts…">
      </div>
    </div>
    <div class="text-list" id="textList"></div>
    <div class="sidebar-footer" id="sidebarFooter"></div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <div class="toolbar">
      <a class="icon-btn" id="homeLink" href="home.html" title="Home" target="_blank" rel="noopener" style="text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>

      <button class="icon-btn menu-toggle" id="menuToggle" title="Toggle library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="group" title="Font size">
        <button class="icon-btn" id="fontDec">A−</button>
        <button class="icon-btn" id="fontInc">A+</button>
      </div>

      <div class="group" title="Reading width">
        <button class="icon-btn" id="widthDec">↔−</button>
        <button class="icon-btn" id="widthInc">↔+</button>
      </div>

      <div class="group" id="columnGroup" title="Columns">
        <button class="icon-btn col-btn" id="col1Btn" data-cols="1">1 col</button>
        <button class="icon-btn col-btn" id="col2Btn" data-cols="2">2 col</button>
        <button class="icon-btn col-btn" id="col3Btn" data-cols="3">3 col</button>
      </div>

      <select id="fontFamilySelect" title="Font"></select>

      <div class="sep"></div>

      <span class="glossary-badge" id="glossaryCount"></span>

      <div class="spacer"></div>

      <button class="btn ghost" id="vocabBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Vocabulary <span id="vocabCount">0</span>
      </button>
    </div>

    <div class="reader-scroll" id="readerScroll">
      <div class="reader-col" id="readerCol">
        <div class="empty-state">
          <h2>Pick a text to start reading</h2>
          <p>Choose any title from the library on the left. Words covered by the glossary are highlighted — click one to see its translation.</p>
        </div>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="vocabModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>My Vocabulary</h2>
      <button class="icon-btn" id="vocabModalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

 any superstitions. It might be expected that people with more education would be less superstitious, but results from the survey indicated almost equal numbers of believers between those with and without college degrees. Of those survey respondents who never finished or only finished high school, 42% reported being at least a little superstitious. For those with a college education, 47% claimed the same minimal level of belief. In the survey, 10 common superstitions were listed for the people who responded. Of these superstitions, five were related to good luck and five to bad luck. Respondents were then asked to check the ones they believed. Of the superstitions in the list, good luck superstitions were more widely held. The top superstitions related to good luck that most people followed very much were picking four-leaf clovers, 79%, knocking on wood, 72%, picking up pennies, 70%, and crossing fingers for luck, 59%. Of the bad luck superstitions, the most common belief was that breaking a mirror brought bad luck, 82%. Other bad luck superstitions listed in the survey included seeing black cats, walking under ladders, seeing the bride before the wedding, and doing anything on Friday the 13th. Many people would like to think it could not hurt to do something like knocking on wood or crossing your fingers to bring a little luck. After all, who doesn't want a little luck? "

// ---------- persistence ----------
function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem('reader_settings') || '{}');
    if (saved.fontSize) state.fontSize = saved.fontSize;
    if (saved.readerWidth) state.readerWidth = saved.readerWidth;
    if (saved.columns) state.columns = saved.columns;
    if (saved.fontFamily) state.fontFamily = saved.fontFamily;
  }catch(e){}
}
function saveSettings(){
  try{
    localStorage.setItem('reader_settings', JSON.stringify({
      fontSize: state.fontSize,
      readerWidth: state.readerWidth,
      columns: state.columns,
      fontFamily: state.fontFamily
    }));
  }catch(e){}
}
function loadVocab(){
  try{
    const saved = JSON.parse(localStorage.getItem('reader_vocab') || '{}');
    state.vocab = new Map(Object.entries(saved));
  }catch(e){ state.vocab = new Map(); }
}
function saveVocab(){
  try{
    localStorage.setItem('reader_vocab', JSON.stringify(Object.fromEntries(state.vocab)));
  }catch(e){}
}
function loadCompleted(){
  try{
    const saved = JSON.parse(localStorage.getItem('reader_completed') || '[]');
    state.completed = new Set(saved);
  }catch(e){ state.completed = new Set(); }
}
function saveCompleted(){
  try{
    localStorage.setItem('reader_completed', JSON.stringify([...state.completed]));
  }catch(e){}
}
function toggleCompleted(id){
  if (state.completed.has(id)) state.completed.delete(id);
  else state.completed.add(id);
  saveCompleted();
}
// ---------- CSV parsing ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = '';
        if (row.some(f => f.trim() !== '')) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); if (row.some(f => f.trim() !== '')) rows.push(row); }
  return rows
    .filter(r => r.length >= 2)
    .filter(r => !(rows.indexOf(r) === 0 && /^word$/i.test(r[0].trim()) && /translation/i.test(r[1].trim())))
    .map(r => ({ term: r[0].trim(), translation: r[1].trim() }))
    .filter(r => r.term.length > 0);
}

function buildGlossaryMap(rows){
  const map = new Map();
  rows.forEach(({term, translation}) => {
    if (term) map.set(term.toLowerCase(), { term, translation });
  });
  return map;
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

let glossaryRegex = null;
function rebuildRegex(){
  const terms = [...state.glossary.values()].map(v => v.term)
    .sort((a,b) => b.length - a.length);
  if (!terms.length){ glossaryRegex = null; return; }
  const pattern = terms.map(escapeRegex).join('|');
  glossaryRegex = new RegExp('\\b(' + pattern + ')\\b', 'gi');
}

// ---------- rendering ----------
function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Word tokenizer used for vocabulary tracking (Latin letters incl. accents, plus apostrophes)
const WORD_RE = /[A-Za-zÀ-ÖØ-öø-ÿ']+/g;

function normalizeWord(w){
  return w.replace(/^'+|'+$/g, '').toLowerCase();
}

// Wraps every word in a plain-text segment (i.e. text NOT already part of a
// glossary match) so it can be clicked to add/edit vocabulary tracking.
function renderWordsSegment(segment){
  let out = '';
  let idx = 0;
  WORD_RE.lastIndex = 0;
  let m;
  while ((m = WORD_RE.exec(segment)) !== null){
    out += escapeHTML(segment.slice(idx, m.index));
    const word = m[0];
    const key = normalizeWord(word);
    const entry = key ? state.vocab.get(key) : null;
    if (entry){
      out += `<span class="vw status-${entry.status}" data-word="${escapeHTML(word)}">${escapeHTML(word)}</span>`;
    } else {
      out += `<span class="word" data-word="${escapeHTML(word)}">${escapeHTML(word)}</span>`;
    }
    idx = m.index + word.length;
  }
  out += escapeHTML(segment.slice(idx));
  return out;
}

function highlightParagraph(text){
  if (!glossaryRegex){ return renderWordsSegment(text); }
  let out = '';
  let lastIndex = 0;
  glossaryRegex.lastIndex = 0;
  let m;
  while ((m = glossaryRegex.exec(text)) !== null){
    out += renderWordsSegment(text.slice(lastIndex, m.index));
    const matched = m[0];
    const entry = state.glossary.get(matched.toLowerCase());
    out += `<span class="gw" data-term="${escapeHTML(entry.term)}">${escapeHTML(matched)}</span>`;
    lastIndex = m.index + matched.length;
  }
  out += renderWordsSegment(text.slice(lastIndex));
  return out;
}

function renderText(textObj){
  const col = document.getElementById('readerCol');
  const paragraphs = textObj.body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const html = paragraphs.map(p => `<p>${highlightParagraph(p)}</p>`).join('');
  const isDone = state.completed.has(textObj.id);
  col.innerHTML = `
    <div class="reader-title-row">
      <div class="reader-title">${escapeHTML(textObj.title)}</div>
      <button class="complete-btn ${isDone ? 'is-complete' : ''}" id="completeBtn" data-id="${textObj.id}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>${isDone ? 'Lesson Completed' : 'Complete Lesson'}</span>
      </button>
    </div>
    <div class="reader-body" id="readerBody">${html}</div>
    <div class="page-nav" id="pageNav">
      <button class="page-nav-btn" id="pagePrev">‹ Prev</button>
      <span class="page-nav-status" id="pageStatus"></span>
      <button class="page-nav-btn" id="pageNext">Next ›</button>
    </div>
  `;
  document.getElementById('readerScroll').scrollTop = 0;
  setupColumnPaging();
}

function renderTextList(filter){
  const listEl = document.getElementById('textList');
  const f = (filter || '').trim().toLowerCase();
  const items = TEXTS.filter(t => !f || t.title.toLowerCase().includes(f));

  const grouped = new Map();
  items.forEach(t => {
    const cat = t.category || 'Uncategorized';
    if (!grouped.has(cat)) grouped.set(cat, []);
    grouped.get(cat).push(t);
  });

  // preserve category order as first seen in the full TEXTS list
  const categoryOrder = [];
  TEXTS.forEach(t => {
    const cat = t.category || 'Uncategorized';
    if (!categoryOrder.includes(cat)) categoryOrder.push(cat);
  });

  listEl.innerHTML = categoryOrder.map(cat => {
    const catItems = grouped.get(cat) || [];
    if (f && !catItems.length) return ''; // hide empty categories while searching
    const isExpanded = f ? true : state.expandedCategories.has(cat);
    const doneCount = catItems.filter(t => state.completed.has(t.id)).length;
    const pct = catItems.length ? Math.round((doneCount / catItems.length) * 100) : 0;
    return `
      <div class="category-group">
        <button class="category-header" data-category="${escapeHTML(cat)}">
          <svg class="chev ${isExpanded ? 'open' : ''}" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
          <span class="category-name">${escapeHTML(cat)}</span>
          ${doneCount ? `<span class="category-progress">${pct}%</span>` : ''}
          <span class="category-count">${catItems.length}</span>
        </button>
        ${isExpanded ? `
          <div class="category-items">
            ${catItems.map(t => `
              <div class="text-item ${t.id === state.activeTextId ? 'active' : ''} ${state.completed.has(t.id) ? 'completed' : ''}" data-id="${t.id}">
                <span class="n">${String(t.id).padStart(2,'0')}</span>
                <span class="t">${escapeHTML(t.title)}</span>
                <span class="check">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('sidebarFooter').textContent = `${TEXTS.length} texts`;
}

function selectText(id){
  const t = TEXTS.find(x => x.id === id);
  if (!t) return;
  state.activeTextId = id;
  renderText(t);
  renderTextList(document.getElementById('searchInput').value);
  if (window.innerWidth <= 820) document.getElementById('sidebar').classList.add('collapsed');
}

// ---------- controls ----------
function applyReaderStyles(){
  document.documentElement.style.setProperty('--reader-size', state.fontSize + 'px');
  document.documentElement.style.setProperty('--reader-width', state.readerWidth + 'px');
  document.documentElement.style.setProperty('--reader-columns', state.columns);
  document.documentElement.style.setProperty('--reader-font', state.fontFamily);
  document.querySelectorAll('.col-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.cols) === state.columns);
  });
  setupColumnPaging();
}

function setupColumnPaging(){
  const body = document.getElementById('readerBody');
  const nav = document.getElementById('pageNav');
  if (!body || !nav) return;

  if (state.columns <= 1){
    body.classList.remove('paged');
    body.style.height = '';
    nav.classList.remove('show');
    return;
  }

  const scrollEl = document.getElementById('readerScroll');
  const titleRow = document.querySelector('.reader-title-row');
  const scrollRect = scrollEl.getBoundingClientRect();
  const titleBottom = titleRow ? titleRow.getBoundingClientRect().bottom : scrollRect.top;
  const bottomMargin = 90; // room for the page-nav row + scroll padding
  const availableHeight = window.innerHeight - titleBottom - bottomMargin;

  body.classList.add('paged');
  body.style.height = Math.max(280, availableHeight) + 'px';
  nav.classList.add('show');

  if (body.dataset.pagedColumns !== String(state.columns)){
    body.dataset.pagedColumns = String(state.columns);
    body.scrollLeft = 0;
  }

  updatePageStatus();
}

function updatePageStatus(){
  const body = document.getElementById('readerBody');
  if (!body) return;
  const prevBtn = document.getElementById('pagePrev');
  const nextBtn = document.getElementById('pageNext');
  const statusEl = document.getElementById('pageStatus');
  if (!prevBtn || !nextBtn || !statusEl) return;

  const pageWidth = body.clientWidth;
  const maxScroll = body.scrollWidth - pageWidth;
  const totalPages = Math.max(1, Math.ceil((body.scrollWidth - 1) / pageWidth));
  let currentPage = 1;
  if (maxScroll > 0 && totalPages > 1){
    currentPage = Math.round((body.scrollLeft / maxScroll) * (totalPages - 1)) + 1;
  }

  statusEl.textContent = `Page ${currentPage} of ${totalPages}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
}

document.getElementById('readerCol').addEventListener('click', (e) => {
  const body = document.getElementById('readerBody');
  if (!body) return;
  if (e.target.closest('#pagePrev')){
    body.scrollBy({ left: -body.clientWidth, behavior: 'smooth' });
  } else if (e.target.closest('#pageNext')){
    body.scrollBy({ left: body.clientWidth, behavior: 'smooth' });
  }
});

document.getElementById('readerCol').addEventListener('scroll', (e) => {
  if (e.target.id === 'readerBody') updatePageStatus();
}, true);

window.addEventListener('resize', () => {
  setupColumnPaging();
});

function populateFontSelect(){
  const sel = document.getElementById('fontFamilySelect');

  sel.value = state.fontFamily;

  el.classList.add('show');
  clearTimeout(showToast._t);

function updateGlossaryBadge(){

}

function updateVocabBadge(){

function refreshActiveText(){
  const active = TEXTS.find(t => t.id === state.activeTextId);
  if (active) renderText(active);

// ---------- popup ----------
let popupEl = null;
function closePopup(){
  if (popupEl){ popupEl.remove(); popupEl = null; }
}
function showPopup(target, term){
  closePopup();
  const entry = state.glossary.get(term.toLowerCase());
  if (!entry) return;
  const rect = target.getBoundingClientRect();
  popupEl = document.createElement('div');
  popupEl.className = 'popup';
  popupEl.innerHTML = `<span class="pw">${escapeHTML(entry.term)}</span>${escapeHTML(entry.translation)}`;
  document.body.appendChild(popupEl);
  const pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;
  let left = rect.left + rect.width/2 - pw/2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = rect.top - ph - 10;
  if (top < 8) top = rect.bottom + 10;
  popupEl.style.left = left + 'px';
  popupEl.style.top = top + 'px';
}

// ---------- vocab popup (interactive) ----------
function showVocabPopup(target, word){
  closePopup();
  const key = normalizeWord(word);
  if (!key) return;
  const existing = state.vocab.get(key);

  popupEl = document.createElement('div');
  popupEl.className = 'vocab-popup';
  popupEl.innerHTML = `
    <div class="vp-term">${escapeHTML(existing ? existing.term : word)}</div>
    <div class="vp-status-row">
      ${Object.entries(VOCAB_STATUSES).map(([id, s]) => `
        <button class="vp-status-btn ${existing && String(existing.status) === id ? 'active' : ''}" data-status="${id}">${s.label}</button>
      `).join('')}
    </div>
    <textarea placeholder="Note / translation (optional)">${existing ? escapeHTML(existing.note || '') : ''}</textarea>
    <div class="vp-actions">
      ${existing ? '<button class="vp-remove" data-action="remove">Remove</button>' : '<span></span>'}
      <button class="vp-done" data-action="done">Done</button>
    </div>
  `;
  document.body.appendChild(popupEl);

  const rect = target.getBoundingClientRect();
  const pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;
  let left = rect.left + rect.width/2 - pw/2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = rect.top - ph - 10;
  if (top < 8) top = rect.bottom + 10;
  popupEl.style.left = left + 'px';
  popupEl.style.top = top + 'px';

  const textarea = popupEl.querySelector('textarea');

  function ensureEntry(status){
    let entry = state.vocab.get(key);
    if (!entry){
      entry = { term: word, status, note: '', updatedAt: Date.now() };
      state.vocab.set(key, entry);
    } else {
      entry.status = status;
      entry.updatedAt = Date.now();
    }
    return entry;
  }

  popupEl.querySelectorAll('.vp-status-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const status = Number(btn.dataset.status);
      ensureEntry(status);
      popupEl.querySelectorAll('.vp-status-btn').forEach(b => b.classList.toggle('active', b === btn));
      saveVocab();
      updateVocabBadge();
      refreshActiveText();
    });
  });

  textarea.addEventListener('click', (e) => e.stopPropagation());
  textarea.addEventListener('input', () => {
    const entry = state.vocab.get(key);
    if (entry){
      entry.note = textarea.value;
      entry.updatedAt = Date.now();
      saveVocab();
    }
  });

  const removeBtn = popupEl.querySelector('.vp-remove');
  if (removeBtn){
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.vocab.delete(key);
      saveVocab();
      updateVocabBadge();
      refreshActiveText();
      closePopup();
    });
  }

  popupEl.querySelector('.vp-done').addEventListener('click', (e) => {
    e.stopPropagation();
    // If the user opened the popup but never picked a status, don't create
    // an empty entry just from typing a note with no status chosen.
    const entry = state.vocab.get(key);
    if (entry && !textarea.value.trim() && !entry.note) { /* fine, keep as-is */ }
    closePopup();
  });
}

// ---------- vocabulary modal ----------
let vocabFilter = 'all';

function openVocabModal(){
  document.getElementById('vocabModalOverlay').classList.add('show');
  renderVocabList();
}
function closeVocabModal(){
  document.getElementById('vocabModalOverlay').classList.remove('show');
}

function renderVocabList(){
  const listEl = document.getElementById('vocabList');
  let entries = [...state.vocab.entries()];
  if (vocabFilter !== 'all'){
    entries = entries.filter(([, e]) => String(e.status) === vocabFilter);
  }
  entries.sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

  if (!entries.length){
    listEl.innerHTML = `<div class="vocab-empty">No words here yet. Click any word in a text to start tracking it.</div>`;
    return;
  }

  listEl.innerHTML = entries.map(([key, e]) => `
    <div class="vocab-row" data-key="${escapeHTML(key)}">
      <div class="vr-dot status-${e.status}"></div>
      <div class="vr-main">
        <div class="vr-term">${escapeHTML(e.term)}</div>
        ${e.note ? `<div class="vr-note">${escapeHTML(e.note)}</div>` : ''}
      </div>
      <select class="vr-select" data-key="${escapeHTML(key)}">
        ${Object.entries(VOCAB_STATUSES).map(([id, s]) => `<option value="${id}" ${String(e.status)===id?'selected':''}>${s.label}</option>`).join('')}
      </select>
      <button class="vr-del" data-key="${escapeHTML(key)}" title="Remove">×</button>
    </div>
  `).join('');
}

document.getElementById('vocabBtn').addEventListener('click', openVocabModal);
document.getElementById('vocabModalClose').addEventListener('click', closeVocabModal);
document.getElementById('vocabModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'vocabModalOverlay') closeVocabModal();
});
document.getElementById('vocabFilters').addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  vocabFilter = chip.dataset.filter;
  document.querySelectorAll('#vocabFilters .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
  renderVocabList();
});
document.getElementById('vocabList').addEventListener('change', (e) => {
  const sel = e.target.closest('.vr-select');
  if (!sel) return;
  const entry = state.vocab.get(sel.dataset.key);
  if (entry){
    entry.status = Number(sel.value);
    entry.updatedAt = Date.now();
    saveVocab();
    renderVocabList();
    refreshActiveText();
  }
});
document.getElementById('vocabList').addEventListener('click', (e) => {
  const del = e.target.closest('.vr-del');
  if (!del) return;
  state.vocab.delete(del.dataset.key);
  saveVocab();
  updateVocabBadge();
  renderVocabList();
  refreshActiveText();
});

// ---------- events ----------
document.addEventListener('click', (e) => {
  if (e.target.closest('.vocab-popup')) return; // handled by its own listeners
  const gw = e.target.closest('.gw');
  if (gw){
    e.stopPropagation();
    showPopup(gw, gw.dataset.term);
    return;
  }
  const vword = e.target.closest('.vw, .word');
  if (vword){
    e.stopPropagation();
    showVocabPopup(vword, vword.dataset.word);
    return;
  }
  const completeBtn = e.target.closest('.complete-btn');
  if (completeBtn){
    toggleCompleted(Number(completeBtn.dataset.id));
    const t = TEXTS.find(x => x.id === state.activeTextId);
    if (t) renderText(t);
    renderTextList(document.getElementById('searchInput').value);
    return;
  }
  const item = e.target.closest('.text-item');
  if (item){
    selectText(Number(item.dataset.id));
    return;
  }
  const catHeader = e.target.closest('.category-header');
  if (catHeader){
    const cat = catHeader.dataset.category;
    if (state.expandedCategories.has(cat)) state.expandedCategories.delete(cat);
    else state.expandedCategories.add(cat);
    renderTextList(document.getElementById('searchInput').value);
    return;
  }
  closePopup();
});
document.addEventListener('scroll', closePopup, true);

document.getElementById('searchInput').addEventListener('input', (e) => {
  renderTextList(e.target.value);
});

document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

document.getElementById('fontInc').addEventListener('click', () => {
  state.fontSize = Math.min(MAX_SIZE, state.fontSize + SIZE_STEP);
  applyReaderStyles(); saveSettings();
});
document.getElementById('fontDec').addEventListener('click', () => {
  state.fontSize = Math.max(MIN_SIZE, state.fontSize - SIZE_STEP);
  applyReaderStyles(); saveSettings();
});
document.getElementById('widthInc').addEventListener('click', () => {
  state.readerWidth = Math.min(MAX_WIDTH, state.readerWidth + WIDTH_STEP);
  applyReaderStyles(); saveSettings();
});
document.getElementById('widthDec').addEventListener('click', () => {
  state.readerWidth = Math.max(MIN_WIDTH, state.readerWidth - WIDTH_STEP);
  applyReaderStyles(); saveSettings();
});
document.querySelectorAll('.col-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.columns = Number(btn.dataset.cols);
    applyReaderStyles(); saveSettings();
  });
});
document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
  state.fontFamily = e.target.value;
  applyReaderStyles(); saveSettings();
});

// ---------- init ----------
function init(){
  loadSettings();
  applyReaderStyles();
  populateFontSelect();

  state.glossary = buildGlossaryMap(parseCSV(GLOSSARY_CSV));
  rebuildRegex();
  updateGlossaryBadge();

  loadVocab();
  updateVocabBadge();

  loadCompleted();

  renderTextList('');
  if (TEXTS.length) selectText(TEXTS[0].id);
}
init();
</script>
